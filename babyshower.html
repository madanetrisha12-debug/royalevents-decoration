<script>

function selectPhoto(photoName){

    localStorage.setItem(
        "selectedDecoration",
        photoName
    );

    localStorage.removeItem(
        "selectedVideo"
    );

    localStorage.setItem(
        "selectedService",
        "Baby Shower Decoration"
    );

    window.location.href =
        "index.html#booking";

}

</script>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* YOUR FIREBASE CONFIG */

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain:
    "the-royal-events-ebc7b.firebaseapp.com",

    projectId:
    "the-royal-events-ebc7b",

    storageBucket:
    "the-royal-events-ebc7b.firebasestorage.app",

    messagingSenderId:
    "YOUR_MESSAGING_SENDER_ID",

    appId:
    "YOUR_APP_ID"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* LOAD NEW PHOTOS */

async function loadFirebasePhotos(){

    const container =
        document.getElementById("firebasePhotos");

    const loading =
        document.getElementById("loading");

    try{

        const snapshot =
            await getDocs(
                collection(db,"decorations")
            );

        let found = false;


        snapshot.forEach(function(photoDoc){

            const data =
                photoDoc.data();


            if(
                data.service ===
                "Baby Shower Decoration"
                &&
                data.type === "image"
            ){

                found = true;


                const box =
                    document.createElement("div");

                box.className =
                    "photo-box";


                const img =
                    document.createElement("img");

                img.src =
                    data.imageUrl;


                const button =
                    document.createElement("button");

                button.className =
                    "book-btn";

                button.innerText =
                    "Book This Decoration";


                button.onclick =
                    function(){

                        localStorage.setItem(
                            "selectedDecoration",
                            data.imageUrl
                        );

                        localStorage.removeItem(
                            "selectedVideo"
                        );

                        localStorage.setItem(
                            "selectedService",
                            "Baby Shower Decoration"
                        );

                        window.location.href =
                            "index.html#booking";

                    };


                box.appendChild(img);

                box.appendChild(button);

                container.appendChild(box);

            }

        });


        if(found){

            loading.innerText =
                "New photos available";

        }
        else{

            loading.innerText =
                "No new photos yet.";

        }

    }
    catch(error){

        console.error(error);

        loading.innerText =
            "Unable to load new photos.";

    }

}


loadFirebasePhotos();

</script>
