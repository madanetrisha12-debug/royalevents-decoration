<title>Baby Shower Decoration</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    text-align:center;
}

h1{
    background:#e91e63;
    color:white;
    padding:20px;
    border-radius:10px;
}

h2{
    color:#e91e63;
    margin-top:30px;
}

.photo-box{
    margin-bottom:25px;
}

img{
    width:300px;
    height:220px;
    max-width:90%;
    object-fit:cover;
    margin:10px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.3);
    cursor:pointer;
}

.book-btn{
    display:block;
    width:300px;
    max-width:90%;
    margin:5px auto 20px;
    padding:12px;
    background:#e91e63;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:#6b3e26;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

#firebasePhotos{
    display:flex;
    flex-direction:column;
    align-items:center;
}

#loading{
    color:#555;
}

</style>
