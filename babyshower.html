<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baby Shower Decoration</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    text-align:center;
}

h1{
    background:#e91e63;
    color:white;
    padding:20px;
    border-radius:10px;
}

h2{
    color:#e91e63;
    margin-top:30px;
}

.media-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:25px;
}

img,
video{
    width:300px;
    height:220px;
    max-width:90%;
    object-fit:cover;
    margin:10px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.3);
}

.book-btn{
    display:block;
    width:300px;
    max-width:90%;
    margin:5px auto 20px;
    padding:12px;
    background:#e91e63;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

.book-btn:hover{
    opacity:0.9;
}

#firebasePhotos{
    display:flex;
    flex-direction:column;
    align-items:center;
}

#loading{
    color:#555;
}

.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:#6b3e26;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

</style>

</head>

<body>

<h1>🍼 Baby Shower Decoration 🍼</h1>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain: "the-royal-events-ebc7b.firebaseapp.com",

    storageBucket: "the-royal-events-ebc7b.firebasestorage.app",

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



/* PHOTO SELECTION */

window.selectPhoto = function(photoName){

    localStorage.setItem(
        "selectedDecoration",
        photoName
    );

    localStorage.removeItem(
        "selectedVideo"
    );

    localStorage.setItem(
        "selectedService",
        "Baby Shower Decoration"
    );

    window.location.href =
        "index.html#booking";

};



/* VIDEO SELECTION */

window.selectVideo = function(videoUrl){

    localStorage.setItem(
        "selectedVideo",
        videoUrl
    );

    localStorage.removeItem(
        "selectedDecoration"
    );

    localStorage.setItem(
        "selectedService",
        "Baby Shower Decoration"
    );

    window.location.href =
        "index.html#booking";

};
