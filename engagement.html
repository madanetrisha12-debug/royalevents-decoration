<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engagement Decoration</title>
</head>
<body>

<h1>💖 Engagement Decoration💖</h1>

<img src="engagement1.jpeg.jpeg"width="300">
<img src="engagement2.jpeg.jpeg"width="300">
<img src="engagement3.jpeg.jpeg"width="300">
<img src="engagement4.jpeg.jpeg"width="300">
<img src="engagement5.jpeg.jpeg""width="300">
<img src="engagement6.jpeg.jpeg"width="300">
<img src="engagement7.jpeg.jpeg"width="300">


<video controls width="200">
    <source src="engagement.mp4" type="video/mp4">

</video>

<br><br>


<a href="index.html" class="back">⬅ Back to Home</a>

<script>

document.querySelectorAll("img").forEach(function(img){

    img.style.cursor = "pointer";

    img.onclick = function(){

        localStorage.setItem(
            "selectedDecoration",
            img.src
        );

        localStorage.removeItem("selectedVideo");

        localStorage.setItem(
            "selectedService",
            "Engagement Decoration"
        );

        window.location.href = "index.html#booking";

    };

});


document.querySelectorAll("video").forEach(function(video){

    video.style.cursor = "pointer";

    video.onclick = function(){

        let source = video.querySelector("source");

        localStorage.setItem(
            "selectedVideo",
            source.src
        );

        localStorage.removeItem("selectedDecoration");

        localStorage.setItem(
            "selectedService",
            "Engagement Decoration"
        );

        window.location.href = "index.html#booking";

    };

});

</script>
</body>
</html>
