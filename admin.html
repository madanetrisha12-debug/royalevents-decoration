<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Royal Events - Admin Panel</title>

<style>

    
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
}

/* LOGIN */

.login-box{
    width:90%;
    max-width:400px;
    margin:100px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

.login-box h1,
.login-box h2{
    text-align:center;
}

.login-box h1{
    color:#6b3e26;
    margin-bottom:10px;
}

.login-box h2{
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 18px;
    background:#6b3e26;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.login-button{
    width:100%;
    margin-top:10px;
}

#message{
    text-align:center;
    margin-top:15px;
}

/* DASHBOARD */

.dashboard{
    display:none;
}

header{
    background:#6b3e26;
    color:white;
    padding:20px;
    text-align:center;
}

.logout{
    margin-top:15px;
    background:#222;
}

/* CARDS */

.dashboard-content{
    padding:25px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

.card h3{
    margin-bottom:10px;
}

.card p{
    font-size:30px;
    font-weight:bold;
}

/* BOOKINGS */

.bookings{
    background:white;
    margin-top:30px;
    padding:20px;
    border-radius:10px;
    overflow-x:auto;
}

.bookings h2{
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#6b3e26;
    color:white;
}

.status{
    padding:6px 10px;
    border-radius:5px;
    border:none;
}

.status-select{
    padding:7px;
    border-radius:5px;
}

.empty{
    text-align:center;
    padding:20px;
}

/* MOBILE */

@media(max-width:800px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:500px){

    .cards{
        grid-template-columns:1fr;
    }

    .dashboard-content{
        padding:15px;
    }

}

</style>
</head>

<body>


<!-- LOGIN -->

<div class="login-box" id="loginBox">

    <h1>THE ROYAL EVENTS</h1>

    <h2>Admin Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Admin Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button
        class="login-button"
        onclick="loginAdmin()">
        Login
    </button>

    <p id="message"></p>

</div>


<!-- DASHBOARD -->

<div class="dashboard" id="dashboard">

<header>

    <h1>THE ROYAL EVENTS</h1>

    <p>Admin Dashboard</p>

    <button
        class="logout"
        onclick="logoutAdmin()">
        Logout
    </button>

</header>


<div class="dashboard-content">

<h2>Booking Dashboard</h2>
<h2>📷 Add Decoration Photo</h2>

<input type="file" id="decorationPhoto" accept="image/*">

<br><br>

<button onclick="uploadDecoration()">
    Upload Photo
</button>

<p id="uploadMessage"></p>
<br>


<!-- CARDS -->

<div class="cards">

    <div class="card">
        <h3>Total Bookings</h3>
        <p id="totalBookings">0</p>
    </div>

    <div class="card">
        <h3>Pending</h3>
        <p id="pendingBookings">0</p>
    </div>

    <div class="card">
        <h3>Confirmed</h3>
        <p id="confirmedBookings">0</p>
    </div>

    <div class="card">
        <h3>Cancelled</h3>
        <p id="cancelledBookings">0</p>
    </div>

</div>


<!-- BOOKINGS TABLE -->

<div class="bookings">

<h2>All Bookings</h2>

<table>

<thead>

<tr>

<th>Booking ID</th>
<th>Customer</th>
<th>Mobile</th>
<th>Service</th>
<th>Date</th>
<th>Location</th>
<th>Requirement</th>
<th>Status</th>

</tr>

</thead>


<tbody id="bookingList">

<tr>
<td colspan="8" class="empty">
Loading bookings...
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>
    

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc,
    addDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE CONFIG */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBQ3VaEXDkNC559MqQXTV8D_Ju5UtF_EvQ",
  authDomain: "the-royal-events-ebc7b.firebaseapp.com",
  projectId: "the-royal-events-ebc7b",
  storageBucket: "the-royal-events-ebc7b.firebasestorage.app",
  messagingSenderId: "495660292303",
  appId: "1:495660292303:web:b49e633791df627baa3fba",
  measurementId: "G-CW7EWM5EBH"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* LOGIN */

window.loginAdmin = function(){

    let email =
    document.getElementById("email").value;

    let password =
    document.getElementById("password").value;

    let message =
    document.getElementById("message");


    signInWithEmailAndPassword(
        auth,
        email,
        password
    )

    .then(() => {

        document.getElementById("loginBox")
        .style.display = "none";

        document.getElementById("dashboard")
        .style.display = "block";

        loadBookings();

    })

    .catch((error) => {

        message.innerText =
        "Invalid email or password.";

    });

};


/* LOAD BOOKINGS */

async function loadBookings(){

    const bookingList =
    document.getElementById("bookingList");


    bookingList.innerHTML = "";


    try{

        const querySnapshot =
        await getDocs(
            collection(db,"booking")
        );


        let total = 0;
        let pending = 0;
        let confirmed = 0;
        let cancelled = 0;


        if(querySnapshot.empty){

            bookingList.innerHTML = `
            <tr>
            <td colspan="8" class="empty">
            No bookings yet
            </td>
            </tr>
            `;

        }


        querySnapshot.forEach((bookingDoc) => {

            const data =
            bookingDoc.data();


            total++;


            let status =
            data.status || "Pending";


            if(status === "Pending"){
                pending++;
            }

            if(status === "Confirmed"){
                confirmed++;
            }

            if(status === "Cancelled"){
                cancelled++;
            }


            const row =
            document.createElement("tr");


            row.innerHTML = `

            <td>${data.bookingID || ""}</td>

            <td>${data.name || ""}</td>

            <td>${data.mobile || ""}</td>

            <td>${data.service || ""}</td>

            <td>${data.date || ""}</td>

            <td>${data.location || ""}</td>

            <td>${data.message || ""}</td>

            <td>

            <select
            class="status-select"
            onchange="changeStatus('${bookingDoc.id}', this.value)">

            <option
            ${status === "Pending" ? "selected" : ""}>
            Pending
            </option>

            <option
            ${status === "Confirmed" ? "selected" : ""}>
            Confirmed
            </option>

            <option
            ${status === "Cancelled" ? "selected" : ""}>
            Cancelled
            </option>

            </select>

            </td>

            `;


            bookingList.appendChild(row);

        });


        document.getElementById("totalBookings")
        .innerText = total;

        document.getElementById("pendingBookings")
        .innerText = pending;

        document.getElementById("confirmedBookings")
        .innerText = confirmed;

        document.getElementById("cancelledBookings")
        .innerText = cancelled;


    }

    catch(error){

        console.error(error);

        bookingList.innerHTML = `
        <tr>
        <td colspan="8" class="empty">
        Unable to load bookings
        </td>
        </tr>
        `;

    }

}
    window.uploadDecoration = function(){

    const photo =
    document.getElementById("decorationPhoto").files[0];

    const message =
    document.getElementById("uploadMessage");

    if(!photo){
        message.innerText = "Photo select करा.";
        return;
    }

    message.innerText = "Uploading...";

    const widget = cloudinary.createUploadWidget(
        {
            cloudName: "vu5cbesg",
            uploadPreset: "royal_events_upload",
            sources: ["local"],
            multiple: false
        },
        async function(error, result){

            if(error){
                console.error(error);
                message.innerText = "Upload failed.";
                return;
            }

            if(result.event === "success"){

                await addDoc(
                    collection(db, "decorations"),
                    {
                        imageUrl: result.info.secure_url,
                        createdAt: new Date()
                    }
                );

                message.innerText =
                "Photo successfully uploaded!";

            }
        }
    );

    widget.open();
};


/* CHANGE STATUS */

window.changeStatus = async function(
    bookingId,
    newStatus
){

    try{

        await updateDoc(
            doc(db,"booking",bookingId),
            {
                status:newStatus
            }
        );


        loadBookings();

    }

    catch(error){

        console.error(error);

        alert(
            "Status update failed."
        );

    }

};


/* LOGOUT */

window.logoutAdmin = function(){

    signOut(auth)

    .then(() => {

        document.getElementById("dashboard")
        .style.display = "none";

        document.getElementById("loginBox")
        .style.display = "block";

    });

};

</script>

</body>
</html>
