<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Royal Events Admin Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f4f4;
}

.login-box{
    width:90%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#6b3e26;
    margin-bottom:10px;
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#6b3e26;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

#message{
    text-align:center;
    margin-top:15px;
}

.dashboard{
    display:none;
}
</style>
</head>

<body>

<div class="login-box" id="loginBox">

    <h1>THE ROYAL EVENTS</h1>
    <h2>Admin Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Admin Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="loginAdmin()">
        Login
    </button>

    <p id="message"></p>

</div>


<div class="dashboard" id="dashboard">

    <h1>THE ROYAL EVENTS</h1>

    <h2>Admin Dashboard</h2>

    <p>Login Successful!</p>

    <button onclick="logoutAdmin()">Logout</button>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyBQ3VaEXDkNC559MqQXTV8D_Ju5UtF_EvQ",
    authDomain: "the-royal-events-ebc7b.firebaseapp.com",
    projectId: "the-royal-events-ebc7b",
    storageBucket: "the-royal-events-ebc7b.firebasestorage.app",
    messagingSenderId: "495660292303",
    appId: "1:495660292303:web:b49e633791df627baa3fba",
    measurementId: "G-CW7EWM5EBH"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


window.loginAdmin = function(){

    let email = document.getElementById("email").value;

    let password = document.getElementById("password").value;

    let message = document.getElementById("message");


    signInWithEmailAndPassword(auth, email, password)

    .then(() => {

        document.getElementById("loginBox").style.display = "none";

        document.getElementById("dashboard").style.display = "block";

    })

    .catch((error) => {

        message.innerText = "Invalid email or password.";

    });

};


window.logoutAdmin = function(){

    signOut(auth).then(() => {

        document.getElementById("dashboard").style.display = "none";

        document.getElementById("loginBox").style.display = "block";

    });

};

</script>

</body>
</html>
