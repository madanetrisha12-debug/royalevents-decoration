<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Bride Groom Entry</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    text-align:center;
}

h1{
    background:#6b3e26;
    color:white;
    padding:20px;
    border-radius:10px;
}

video{
    width:300px;
    max-width:90%;
    margin:10px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.3);
}

.book-btn{
    display:block;
    width:300px;
    max-width:90%;
    margin:5px auto 20px;
    padding:12px;
    background:#6b3e26;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:#6b3e26;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

</style>

</head>

<body>

<h1>💍 Bride Groom Entry</h1>


<!-- VIDEO 1 -->

<video controls>
    <source src="bridegroom1.mp4.mp4" type="video/mp4">
</video>

<button class="book-btn"
onclick="selectVideo('bridegroom1.mp4.mp4')">
    Book This Entry
</button>


<!-- VIDEO 2 -->

<video controls>
    <source src="bridegroom2.mp4.mp4" type="video/mp4">
</video>

<button class="book-btn"
onclick="selectVideo('bridegroom2.mp4.mp4')">
    Book This Entry
</button>


<!-- VIDEO 3 -->

<video controls>
    <source src="bridegroom3.mp4.mp4" type="video/mp4">
</video>

<button class="book-btn"
onclick="selectVideo('bridegroom3.mp4.mp4')">
    Book This Entry
</button>


<!-- VIDEO 4 -->

<video controls>
    <source src="bridegroom4.mp4.mp4" type="video/mp4">
</video>

<button class="book-btn"
onclick="selectVideo('bridegroom4.mp4.mp4')">
    Book This Entry
</button>


<br>

<a href="index.html" class="back-btn">
    ⬅ Back to Home
</a>


<script>

function selectVideo(videoName){

    localStorage.setItem(
        "selectedDecoration",
        videoName
    );

    localStorage.setItem(
        "selectedService",
        "Bride-Groom Entry"
    );

    window.location.href =
        "index.html#booking";

}

</script>


</body>
</html>
