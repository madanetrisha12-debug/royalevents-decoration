<!-- OLD PHOTO / VIDEO CLICK -->

<script>

document.querySelectorAll(".gallery img").forEach(function(img){

    img.onclick = function(){

        localStorage.setItem(
            "selectedDecoration",
            img.src
        );

        localStorage.removeItem(
            "selectedVideo"
        );

        localStorage.setItem(
            "selectedService",
            "Naming Ceremony Decoration"
        );

        window.location.href =
            "index.html#booking";

    };

});


document.querySelectorAll(".gallery video").forEach(function(video){

    video.onclick = function(){

        let source =
            video.querySelector("source");

        localStorage.setItem(
            "selectedVideo",
            source.src
        );

        localStorage.removeItem(
            "selectedDecoration"
        );

        localStorage.setItem(
            "selectedService",
            "Naming Ceremony Decoration"
        );

        window.location.href =
            "index.html#booking";

    };

});

</script>


<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyBQ3VaEXDkNC559MqQXTV8D_Ju5UtF_EvQ",

    authDomain:
    "the-royal-events-ebc7b.firebaseapp.com",

    projectId:
    "the-royal-events-ebc7b",

    storageBucket:
    "the-royal-events-ebc7b.firebasestorage.app",

    messagingSenderId:
    "495660292303",

    appId:
    "1:495660292303:web:b49e633791df627baa3fba"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


async function loadPhotos(){

    const gallery =
        document.getElementById(
            "firebaseGallery"
        );

    const loading =
        document.getElementById(
            "loading"
        );

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "decorations"
                )
            );


        let found = false;


        snapshot.forEach(function(doc){

            const data =
                doc.data();


            if(
                data.service ===
                "Naming Ceremony Decoration"
            ){

                found = true;


                /* PHOTO */

                if(
                    data.type === "image"
                    ||
                    !data.type
                ){

                    const img =
                        document.createElement(
                            "img"
                        );

                    img.src =
                        data.imageUrl;


                    img.onclick =
                        function(){

                            localStorage.setItem(
                                "selectedDecoration",
                                img.src
                            );

                            localStorage.removeItem(
                                "selectedVideo"
                            );

                            localStorage.setItem(
                                "selectedService",
                                "Naming Ceremony Decoration"
                            );

                            window.location.href =
                                "index.html#booking";

                        };


                    gallery.appendChild(img);

                }


                /* VIDEO */

                if(
                    data.type === "video"
                ){

                    const video =
                        document.createElement(
                            "video"
                        );

                    video.controls = true;

                    video.src =
                        data.imageUrl;


                    video.onclick =
                        function(){

                            localStorage.setItem(
                                "selectedVideo",
                                video.src
                            );

                            localStorage.removeItem(
                                "selectedDecoration"
                            );

                            localStorage.setItem(
                                "selectedService",
                                "Naming Ceremony Decoration"
                            );

                            window.location.href =
                                "index.html#booking";

                        };


                    gallery.appendChild(video);

                }

            }

        });


        if(found){

            loading.innerText =
                "New photos and videos";

        }
        else{

            loading.innerText =
                "No new photos or videos yet.";

        }


    }
    catch(error){

        console.error(error);

        loading.innerText =
            "Unable to load photos.";

    }

}


loadPhotos();

</script>

</body>
