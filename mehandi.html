<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mehandi Decoration</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    color:#0a8f3d;
    margin-bottom:30px;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.gallery img{
    width:300px;
    height:220px;
    object-fit:cover;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    transition:0.3s;
}

.gallery img:hover{
    transform:scale(1.05);
}

.back{
    display:inline-block;
    margin-top:30px;
    padding:10px 20px;
    background:#0a8f3d;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-size:18px;
}

.back:hover{
    background:#06682c;
}
</style>

</head>

<body>

<h1>💚 Mehandi Decoration</h1>

<div class="gallery">
    <img src="mehandi1.jpeg.jpeg">
    <img src="mehandi2.jpeg.jpeg">
    <img src="mehandi3.jpeg.jpeg">
    <img src="mehandi4.jpeg.jpeg">
</div>

<a href="index.html" class="back">⬅ Back to Home</a>
<script>

document.querySelectorAll(".gallery img").forEach(function(img){

    img.style.cursor = "pointer";

    img.onclick = function(){

        localStorage.setItem(
            "selectedDecoration",
            img.src
        );

        localStorage.setItem(
            "selectedService",
            "Mehandi Decoration"
        );

        window.location.href =
            "index.html#booking";

    };

});

</script>
</body>
</html>
