<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haldi Decoration</title>
</head>

<body>

<h1>🌼 Haldi Decoration</h1>

<h1>Haldi Decoration</h1>

<img src="haldi1.jpeg.jpeg"width="250">
<img src="haldi2.jpeg.jpeg"width="250">
<img src="haldi3.jpeg.jpeg"width="250">
<img src="haldi4.jpeg.jpeg"width="250">
<img src="haldi5.jpeg.jpeg"width="250">
<img src="haldi6.jpeg.jpeg"width="250">
<img src="haldi7.jpeg.jpeg"width="250">
<img src="haldi8.jpeg.jpeg"width="250">
<img src="haldi9.jpeg.jpeg"width="250">

<video controls>
    <source src="haldi.mp4.mp4" type="video/mp4">
</video>

<br><br>

<a href="index.html" class="back">⬅ Back to Home</a>

<script>

document.querySelectorAll("img").forEach(function(img){

    img.style.cursor = "pointer";

    img.onclick = function(){

        localStorage.setItem(
            "selectedDecoration",
            img.src
        );

        localStorage.removeItem("selectedVideo");

        localStorage.setItem(
            "selectedService",
            "Haldi Decoration"
        );

        window.location.href =
            "index.html#booking";

    };

});


document.querySelectorAll("video").forEach(function(video){

    video.style.cursor = "pointer";

    video.onclick = function(){

        let source = video.querySelector("source");

        localStorage.setItem(
            "selectedVideo",
            source.src
        );

        localStorage.removeItem("selectedDecoration");

        localStorage.setItem(
            "selectedService",
            "Haldi Decoration"
        );

        window.location.href =
            "index.html#booking";

    };

});

</script>
</body>
</html>
